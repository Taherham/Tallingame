<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tallingame &mdash; Zombie Outbreak</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <h1>Zombie Outbreak</h1>
    <div class="hud">
      <div>Caught: <span id="caught">0</span> / <span id="total">50</span></div>
      <div>Horde: <span id="horde">4</span></div>
    </div>
    <div class="board-wrap">
      <canvas id="board" width="400" height="400"></canvas>
      <div id="overlay" class="overlay">
        <p id="overlay-title">Zombie Outbreak</p>
        <p id="overlay-msg">You are patient zero. Infect all 50 citizens with your horde of zombies.<br>Arrow keys / WASD to move.</p>
        <button id="start-btn">Start</button>
      </div>
    </div>
    <div class="dpad" id="dpad">
      <button data-dir="up">&#9650;</button>
      <div class="dpad-row">
        <button data-dir="left">&#9664;</button>
        <button data-dir="down">&#9660;</button>
        <button data-dir="right">&#9654;</button>
      </div>
    </div>
    <p class="hint">Get close to a human to infect them &mdash; they'll join your horde and help hunt the rest.</p>
  </div>
  <script src="game.js"></script>
</body>
</html>
