<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gi Path &mdash; Jiu-Jitsu Lessons</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- Path / map view -->
    <section id="view-path" class="view">
      <header class="top-bar">
        <div class="brand">🥋 Gi Path</div>
        <div class="stats">
          <div class="stat" title="Day streak">🔥 <span id="stat-streak">0</span></div>
          <div class="stat" title="Total XP">⭐ <span id="stat-xp">0</span></div>
        </div>
      </header>
      <div id="path-container" class="path-container"></div>
    </section>

    <!-- Lesson view -->
    <section id="view-lesson" class="view hidden">
      <header class="lesson-bar">
        <button id="lesson-close" class="icon-btn" aria-label="Close lesson">&times;</button>
        <div class="progress-track"><div id="lesson-progress" class="progress-fill"></div></div>
        <div class="hearts" id="lesson-hearts"></div>
      </header>
      <div id="question-container" class="question-container"></div>
      <footer class="lesson-footer">
        <div id="feedback-banner" class="feedback-banner hidden">
          <div id="feedback-text" class="feedback-text"></div>
        </div>
        <button id="action-btn" class="primary-btn" disabled>Check</button>
      </footer>
    </section>

    <!-- Lesson complete view -->
    <section id="view-complete" class="view hidden">
      <div class="complete-card">
        <div id="complete-emoji" class="complete-emoji">🎉</div>
        <h2 id="complete-title">Lesson Complete!</h2>
        <div class="complete-stars" id="complete-stars"></div>
        <div class="complete-stats">
          <div class="complete-stat"><span class="label">XP earned</span><span id="complete-xp" class="value">+0</span></div>
          <div class="complete-stat"><span class="label">Accuracy</span><span id="complete-accuracy" class="value">0%</span></div>
        </div>
        <button id="complete-continue" class="primary-btn">Continue</button>
      </div>
    </section>

    <!-- Lesson failed view -->
    <section id="view-failed" class="view hidden">
      <div class="complete-card">
        <div class="complete-emoji">💔</div>
        <h2>Out of Hearts</h2>
        <p class="failed-msg">You ran out of hearts. Review the lesson and try again!</p>
        <button id="failed-retry" class="primary-btn">Retry Lesson</button>
      </div>
    </section>

  </div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
